<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sinewave · Everyone, on the same wavelength</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6cf6'/%3E%3Cpath d='M5 16c2.75-7 5.5-7 8.25 0s5.5 7 8.25 0 3.75-5.5 5.5-3' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <div class="logo"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M5 16c2.75-7 5.5-7 8.25 0s5.5 7 8.25 0 3.75-5.5 5.5-3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg> Sinewave</div>
      <p class="tagline">Everyone, on the same wavelength</p>
      <label>Admin password
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="form-error" id="login-error" hidden></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="logo"><svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M5 16c2.75-7 5.5-7 8.25 0s5.5 7 8.25 0 3.75-5.5 5.5-3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg> Sinewave</div>
      <nav>
        <a href="#/screens" data-nav="screens">Screens</a>
        <a href="#/media" data-nav="media">Media</a>
        <a href="#/playlists" data-nav="playlists">Playlists</a>
      </nav>
      <div class="sidebar-foot">
        <a href="/player/" target="_blank" rel="noopener">Open player ↗</a>
        <button class="link" id="logout">Sign out</button>
      </div>
    </aside>
    <main id="view" class="view"></main>
  </div>

  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
