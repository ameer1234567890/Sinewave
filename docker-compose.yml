# Run Sinewave:  docker compose up -d
# Then open http://localhost:8080 (dashboard) and http://localhost:8080/player/ (player).
# Everything is stored in the "data" volume: the SQLite database (sinewave.db) and uploaded media.
name: sinewave

services:
  sinewave:
    build: .
    image: sinewave:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - data:/data

volumes:
  data:
